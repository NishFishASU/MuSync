<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MuSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand-block">
        <p class="brand">MuSync</p>
        <p class="tagline">Multi-room Bluetooth, one clock</p>
      </div>
      <div class="health" id="health" title="Backend health">…</div>
    </header>

    <main class="layout">
      <section class="panel transport-panel" aria-labelledby="transport-heading">
        <div class="panel-head">
          <h2 id="transport-heading">Transport</h2>
          <p class="now-playing" id="now-playing">No track</p>
        </div>
        <div class="transport-controls">
          <button type="button" class="btn" id="btn-play" aria-label="Play">Play</button>
          <button type="button" class="btn" id="btn-pause" aria-label="Pause">Pause</button>
          <button type="button" class="btn btn-ghost" id="btn-stop" aria-label="Stop">Stop</button>
        </div>
        <div class="scrub">
          <span id="pos-label">0:00</span>
          <input
            type="range"
            id="position"
            min="0"
            max="0"
            value="0"
            step="100"
            aria-label="Playback position"
          />
          <span id="dur-label">0:00</span>
        </div>
      </section>

      <div class="split">
        <section class="panel devices-panel" aria-labelledby="devices-heading">
          <div class="panel-head">
            <h2 id="devices-heading">Devices</h2>
            <p class="hint">Up to 6 BT sinks · tap a row for delay &amp; volume</p>
          </div>
          <ul class="device-list" id="device-list"></ul>
        </section>

        <section class="panel detail-panel" aria-labelledby="detail-heading" id="detail-panel" hidden>
          <div class="panel-head">
            <h2 id="detail-heading">Sink controls</h2>
            <button type="button" class="btn btn-ghost btn-small" id="btn-close-detail">Close</button>
          </div>
          <p class="detail-name" id="detail-name"></p>
          <p class="detail-meta" id="detail-meta"></p>

          <label class="field">
            <span>Delay <em id="delay-readout">0 ms</em></span>
            <input type="range" id="delay" min="0" max="500" step="5" />
          </label>
          <label class="field">
            <span>Volume <em id="volume-readout">80%</em></span>
            <input type="range" id="volume" min="0" max="100" step="1" />
          </label>
          <div class="toggles">
            <label class="check">
              <input type="checkbox" id="mute" />
              <span>Mute</span>
            </label>
            <label class="check">
              <input type="checkbox" id="enabled" />
              <span>Enabled in session</span>
            </label>
          </div>
        </section>
      </div>

      <section class="panel sources-panel" aria-labelledby="sources-heading">
        <div class="panel-head">
          <h2 id="sources-heading">Sources</h2>
          <p class="hint">Local files now · stream / input / movie later</p>
        </div>
        <ul class="source-list" id="source-list"></ul>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
